name: zoomzapzone
description: "Zoom Zap Zone - dodge and zap in neon lanes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  cross_file: '>=0.3.0 <1.0.0'
  in_app_purchase: ^3.2.0
  cupertino_icons: ^1.0.8
  share_plus: ^13.3.1
  in_app_review: ^2.0.12
  qr_flutter: '>=4.1.0 <5.0.0'
  mobile_scanner: '>=5.2.3 <6.0.0'
  file_picker: '>=13.0.0 <14.0.0'
  path_provider: '>=2.1.4 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/zoomzapzone_logo.png
    - assets/wajiha_logo.png
    - assets/sfx/click.wav
    - assets/sfx/good.wav
    - assets/sfx/bad.wav
    - assets/sfx/jump.wav
    - assets/sfx/level.wav
    - assets/sfx/win.wav
    - assets/sfx/lose.wav
    - assets/sfx/music_loop.wav
